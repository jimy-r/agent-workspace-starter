name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  redaction:
    # added-lines mode diffs against the pull request's base branch. A push to
    # main has no base ref, so the gate runs on pull requests only, which is
    # the action's own guidance. validate still runs on every push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # added-lines mode needs the base branch's history

      # Pinned to the commit behind v1.0.1 rather than the v1 tag. The action's
      # release workflow moves v1 to each new release, so a tag reference runs
      # whatever the tag points at on the day CI runs. A full commit SHA can't
      # move, so the code that runs is the code someone reviewed, and a repo
      # generated from this template starts from the same fixed pin.
      # Dependabot (.github/dependabot.yml) still proposes upgrades, as PRs
      # that bump the SHA and this version comment together.
      - uses: jimy-r/redaction-check-action@c626124f07c3dbf0f89764779ef920cf91f36135 # v1.1.1

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Validate .claude/settings.json
        run: python -m json.tool .claude/settings.json > /dev/null

      - name: Validate every JSON file under .claude/
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "Checking $f"
            python -m json.tool "$f" > /dev/null
          done < <(find .claude -name '*.json' -print0)

      - name: Compile-check every hook script under .claude/hooks/
        run: |
          set -euo pipefail
          for f in .claude/hooks/*.py; do
            echo "Compiling $f"
            python -c "import py_compile, sys; py_compile.compile(sys.argv[1], doraise=True)" "$f"
          done

      - name: Run each hook as settings.json wires it, on bad and benign payloads
        # Runs from a directory other than the project root, as a hook does after
        # the agent has cd'd, so a cwd-relative script path fails here. A hook
        # that cannot start exits non-zero but not 2, which Claude Code treats as
        # a non-blocking error and lets the tool call through. Asserting exactly
        # 2 on the bad payloads catches that fail-open. Each payload goes to the
        # hooks whose matcher names its tool, as Claude Code routes it, so a tool
        # no matcher covers (PowerShell on Windows, say) fails here too.
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 - "$CLAUDE_PROJECT_DIR/.claude/settings.json" <<'EOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile

          root = os.environ["CLAUDE_PROJECT_DIR"]
          with open(sys.argv[1], encoding="utf-8") as fh:
              settings = json.load(fh)

          # A bare `git push` sends the current branch, which the guard reads
          # from git. One scratch repo sits on main and one on a feature branch.
          repo = {}
          for branch in ("main", "feature"):
              repo[branch] = tempfile.mkdtemp()
              subprocess.run(["git", "init", "-q", "-b", branch, repo[branch]], check=True)

          def shell(command, tool="Bash"):
              return {"tool_name": tool, "tool_input": {"command": command}}

          cases = {
              2: [
                  {"tool_name": "Write", "tool_input": {"file_path": ".env"}},
                  shell("echo KEY=1 > .env"),
                  shell("git push --force origin feature"),
                  shell("rm -f old.log .env"),
                  shell("mv .env backup.txt"),
                  shell(f'git -C "{repo["main"]}" push'),
                  shell("git push origin HEAD:main"),
                  shell("git push origin +main"),
                  shell("git push origin refs/heads/main"),
                  shell("git push origin feature:main"),
                  shell("git -C some/dir push origin main"),
                  shell("Remove-Item -Path .env -Force", "PowerShell"),
              ],
              0: [
                  {"tool_name": "Write", "tool_input": {"file_path": "docs/notes.md"}},
                  shell("ls -la docs"),
                  shell("rm -f old.log build.log"),
                  shell(f'git -C "{repo["feature"]}" push'),
                  shell("git push origin main:feature"),
                  shell("Get-ChildItem docs", "PowerShell"),
              ],
          }

          def run(hook, payload):
              argv = [hook["command"]] + [
                  a.replace("${CLAUDE_PROJECT_DIR}", root) for a in hook.get("args", [])
              ]
              try:
                  return subprocess.run(
                      argv, input=json.dumps(payload), text=True,
                      capture_output=True, timeout=hook.get("timeout", 600),
                  ).returncode
              except OSError as exc:
                  return f"could not start ({exc})"

          failures = []
          groups = settings["hooks"]["PreToolUse"]
          for group in groups:
              for hook in group["hooks"]:
                  timeout = hook.get("timeout", 600)
                  if timeout > 60:
                      failures.append(f"{group['matcher']}: timeout {timeout} is seconds, not ms")

          for want, payloads in cases.items():
              for payload in payloads:
                  tool = payload["tool_name"]
                  hooks = [
                      hook for group in groups if re.fullmatch(group["matcher"], tool)
                      for hook in group["hooks"]
                  ]
                  if not hooks:
                      print(f"FAIL: no PreToolUse matcher covers the {tool} tool")
                      failures.append(f"{tool}: no matcher")
                      continue
                  got = [run(hook, payload) for hook in hooks]
                  ok = 2 in got if want == 2 else all(code == 0 for code in got)
                  print(f"{'ok' if ok else 'FAIL'}: {tool} {payload['tool_input']}: exit {got}, want {want}")
                  if not ok:
                      failures.append(f"{tool}: {payload['tool_input']}")

          if failures:
              sys.exit("hook check failed: " + "; ".join(failures))
          EOF
